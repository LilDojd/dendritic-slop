name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            all-systems: true
          - os: macos-15
            all-systems: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3

      - name: Check formatting
        if: runner.os == 'Linux'
        run: nix fmt -- --ci

      - name: Evaluate every supported system
        if: matrix.all-systems
        run: nix flake check --no-build --all-systems --keep-going --no-update-lock-file

      - name: Build native checks
        run: nix flake check -L --no-update-lock-file
